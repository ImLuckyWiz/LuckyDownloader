name: Build LuckyDownloader

on:
  push:
    branches: [main, master]
    tags: ["v*"]               # a tag like v1.2 also publishes a Release
  workflow_dispatch:           # manual "Run workflow" button

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: "Run tests"
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
      - name: Check translation catalogs
        run: python tools/i18n.py check

  init-release:
    name: Initialize Release
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare release notes for this tag
        shell: bash
        run: |
          notes=RELEASE_NOTES.md
          first=$(head -n1 "$notes" | sed 's/^## *//; s/[[:space:]]*$//' | tr -d '\r')
          if [ "$first" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=$notes,line=1::First line is '## $first' but the tag is '$GITHUB_REF_NAME'. Update $notes before tagging."
            exit 1
          fi
          awk -v tag="$GITHUB_REF_NAME" '
            { sub(/\r$/, "") }
            $0 == "## " tag { found=1; print; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' "$notes" > RELEASE_NOTES_FOR_TAG.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES_FOR_TAG.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}

  build:
    needs: [test, init-release]
    if: |
      !cancelled() &&
      needs.test.result == 'success' &&
      (needs.init-release.result == 'success' || needs.init-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest          # Apple Silicon
            label: macos-arm64
          - os: ubuntu-latest      # Linux x86_64
            label: linux-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check release notes match the tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          notes=RELEASE_NOTES.md
          first=$(head -n1 "$notes" | sed 's/^## *//; s/[[:space:]]*$//' | tr -d '\r')
          if [ "$first" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=$notes,line=1::First line is '## $first' but the tag is '$GITHUB_REF_NAME'. Update $notes before tagging."
            exit 1
          fi
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            patchelf file zsync
          # Download standalone appimagetool (pinned to 1.9.1 with SHA-256 verification)
          curl -sLfO https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage" | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          sudo mv squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool
          rm -rf appimagetool-x86_64.AppImage
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: "Run tests"
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
      - name: Ensure Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and -not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
      - name: Cache Nuitka compiler cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            ~/AppData/Local/Nuitka/Nuitka/Cache
            ~/Library/Caches/Nuitka
          key: ${{ runner.os }}-nuitka-${{ hashFiles('requirements.txt', 'luckytwitch_qt.py') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build_windows.bat ${{ github.ref_type == 'tag' && github.ref_name || '1.0' }}
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: bash build_mac.sh "${{ github.ref_type == 'tag' && github.ref_name || '1.0' }}"
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: bash build_linux.sh "${{ github.ref_type == 'tag' && github.ref_name || '1.0' }}"
      - name: Smoke test packaged catalogs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\LuckyDownloader\LuckyDownloader.exe" -ArgumentList "--i18n-selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The Windows build cannot find its translations (--i18n-selftest exit code $($p.ExitCode))" }
      - name: Smoke test packaged catalogs (macOS)
        if: runner.os == 'macOS'
        run: dist/LuckyDownloader.app/Contents/MacOS/LuckyDownloader --i18n-selftest
      - name: Smoke test packaged catalogs (Linux)
        if: runner.os == 'Linux'
        run: dist/LuckyDownloader/LuckyDownloader --i18n-selftest
      - uses: actions/upload-artifact@v4
        with:
          name: LuckyDownloader-${{ matrix.label }}
          path: |
            dist/LuckyDownloader-Setup.exe
            dist/LuckyDownloader-*.dmg
            dist/LuckyDownloader-*.AppImage
            dist/LuckyDownloader-*.tar.gz
      - name: Upload binaries to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LuckyDownloader-Setup.exe
            dist/LuckyDownloader-*.dmg
            dist/LuckyDownloader-*.AppImage
            dist/LuckyDownloader-*.tar.gz
          fail_on_unmatched_files: false

  plugin:
    needs: [test, init-release]
    if: |
      !cancelled() &&
      needs.test.result == 'success' &&
      (needs.init-release.result == 'success' || needs.init-release.result == 'skipped')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check and test the Premiere CEP panel
        working-directory: premiere-plugin-cep
        run: |
          npm run check
          npm test
      - name: Package Premiere CEP extension (ZIP and ZXP)
        run: |
          python tools/package_cep.py --dist dist
      - name: Verify packaged files
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/LuckyDownloader-Premiere-Plugin-CEP.zip")) { throw "Missing ZIP" }
          if (-not (Test-Path "dist/LuckyDownloader-Premiere-Plugin-CEP.zxp")) { throw "Missing ZXP" }
          Write-Host "Packaged artifacts verified successfully."
      - uses: actions/upload-artifact@v4
        with:
          name: LuckyDownloader-plugin
          path: |
            dist/LuckyDownloader-Premiere-Plugin-CEP.zip
            dist/LuckyDownloader-Premiere-Plugin-CEP.zxp
            dist/LuckyTwitch-Premiere-Plugin-CEP.zip
            dist/LuckyTwitch-Premiere-Plugin-CEP.zxp
      - name: Upload Premiere plugin to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LuckyDownloader-Premiere-Plugin-CEP.zip
            dist/LuckyDownloader-Premiere-Plugin-CEP.zxp
            dist/LuckyTwitch-Premiere-Plugin-CEP.zip
            dist/LuckyTwitch-Premiere-Plugin-CEP.zxp
          fail_on_unmatched_files: false

  build-cli:
    name: Build CLI (${{ matrix.label }})
    needs: [build]
    if: |
      !cancelled() &&
      needs.build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos-arm64
          - os: ubuntu-latest
            label: linux-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Nuitka compiler cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            ~/AppData/Local/Nuitka/Nuitka/Cache
            ~/Library/Caches/Nuitka
          key: ${{ runner.os }}-nuitka-cli-${{ hashFiles('requirements-cli.txt', 'cli.py') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-cli-
      - name: Build CLI (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build_windows_cli.bat ${{ github.ref_type == 'tag' && github.ref_name || '1.0' }}
      - name: Build CLI (macOS)
        if: runner.os == 'macOS'
        run: bash build_mac_cli.sh "${{ github.ref_type == 'tag' && github.ref_name || '1.0' }}"
      - name: Build CLI (Linux)
        if: runner.os == 'Linux'
        run: bash build_linux_cli.sh "${{ github.ref_type == 'tag' && github.ref_name || '1.0' }}"
      - name: Smoke test CLI help (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\LuckyDownloader-CLI\LuckyDownloader-CLI.exe" -ArgumentList "--help" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "CLI --help failed with exit code $($p.ExitCode)" }
      - name: Smoke test CLI help (macOS)
        if: runner.os == 'macOS'
        run: dist/LuckyDownloader-CLI/LuckyDownloader-CLI --help
      - name: Smoke test CLI help (Linux)
        if: runner.os == 'Linux'
        run: dist/LuckyDownloader-CLI/LuckyDownloader-CLI --help
      - uses: actions/upload-artifact@v4
        with:
          name: LuckyDownloader-CLI-${{ matrix.label }}
          path: |
            dist/LuckyDownloader-CLI-windows.zip
            dist/LuckyDownloader-CLI-macos-*.tar.gz
            dist/LuckyDownloader-CLI-linux-*.tar.gz
      - name: Upload CLI binaries to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LuckyDownloader-CLI-windows.zip
            dist/LuckyDownloader-CLI-macos-*.tar.gz
            dist/LuckyDownloader-CLI-linux-*.tar.gz
          fail_on_unmatched_files: false

  checksums:
    name: Generate and Upload SHA256SUMS
    needs: [build, build-cli, plugin]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: LuckyDownloader-*
          merge-multiple: true
          path: release
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
      - name: Upload SHA256SUMS to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/SHA256SUMS.txt
